services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: index
      POSTGRES_PASSWORD: index
      POSTGRES_DB: index
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U index -d index"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://index:index@db:5432/index
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
